<section
	aria-label="Playback controls"
	class="grid h-full min-h-0 grid-rows-[var(--range-progress-idle-thickness)_minmax(0,1fr)] bg-surface"
	data-testid="playback-dock"
>
	<app-range-control
		class="range-control-progress h-[var(--range-progress-idle-thickness)]"
		data-range-control="playback"
		[min]="0"
		[max]="session.durationMs() ?? 0"
		[step]="100"
		[value]="seekValue()"
		[progress]="progressPercent()"
		label="Playback position"
		[disabled]="!canSeek"
		(valueInput)="onSeekInput($event)"
		(valueChange)="onSeekChange($event)"
	></app-range-control>
	<div
		class="grid min-h-0 min-w-0 grid-cols-[minmax(0,1fr)_auto] grid-rows-[auto_auto] items-center gap-x-4 px-[var(--layout-inline-padding)] py-[var(--shell-dock-block-padding)] app-wide:w-full app-wide:grid-cols-[minmax(0,1fr)_minmax(360px,2fr)_minmax(0,1fr)] app-wide:grid-rows-1 app-wide:gap-6 app-wide:px-[var(--layout-inline-padding)] app-wide:py-[var(--shell-dock-block-padding)]"
	>
		<div class="flex min-w-0 items-center gap-3" data-region="playback-identity">
			<app-artwork
				class="size-10 shrink-0 rounded-control app-wide:size-10"
				[artwork]="session.artwork()"
				[alt]="session.title() + ' artwork'"
				loading="eager"
			/>
			<div class="min-w-0">
				<p class="truncate text-body-md text-text-primary">{{ session.title() }}</p>
				@if (session.artist(); as artist) {
				<p class="truncate text-body-sm text-text-secondary">{{ artist }}</p>
				}
			</div>
		</div>

		<div class="col-span-2 min-w-0 app-wide:col-span-1" data-region="playback-core">
			<div class="flex items-center justify-center gap-3" aria-label="Transport controls">
				<span class="text-body-sm text-text-secondary tabular-nums"
					>{{ seekValue() | formatDuration }}</span
				>
				<button
					type="button"
					appButton="transport"
					aria-label="Previous track"
					[disabled]="!session.snapshot()?.canGoPrevious || session.transportPending() !== null"
					(click)="session.previous()"
				>
					<svg lucideSkipBack aria-hidden="true" class="size-5"></svg>
				</button>
				<button
					type="button"
					appButton="transport"
					[aria-label]="isPlaying ? 'Pause' : 'Resume'"
					[disabled]="session.snapshot()?.status !== 'playing' && session.snapshot()?.status !== 'paused' || session.transportPending() !== null"
					(click)="togglePlayback()"
				>
					@if (isPlaying) {
					<svg lucidePause aria-hidden="true" class="size-5"></svg>
					} @else {
					<svg lucidePlay aria-hidden="true" class="size-5"></svg>
					}
				</button>
				<button
					type="button"
					appButton="transport"
					aria-label="Next track"
					[disabled]="!session.snapshot()?.canGoNext || session.transportPending() !== null"
					(click)="session.next()"
				>
					<svg lucideSkipForward aria-hidden="true" class="size-5"></svg>
				</button>
				<span class="text-body-sm text-text-secondary tabular-nums"
					>{{ session.durationMs() | formatDuration }}</span
				>
			</div>
		</div>

		<div class="flex min-w-0 items-center justify-end gap-2" data-region="volume">
			<button
				type="button"
				appButton="icon"
				[aria-label]="session.muted() ? 'Unmute' : 'Mute'"
				[disabled]="session.mutePending()"
				(click)="session.toggleMute()"
			>
				@if (session.muted()) {
				<svg lucideVolumeX aria-hidden="true" class="size-5"></svg>
				} @else {
				<svg lucideVolume2 aria-hidden="true" class="size-5"></svg>
				}
			</button>
			<app-range-control
				class="range-control-volume h-[var(--range-hit-height)] app-wide:w-[var(--range-volume-width)] app-wide:flex-none"
				data-range-control="volume"
				[attr.data-muted]="session.muted() ? '' : null"
				[min]="0"
				[max]="1"
				[step]="0.01"
				[value]="session.volume()"
				[progress]="volumePercent()"
				label="Volume"
				[valueText]="session.muted() ? 'Muted' : null"
				(valueInput)="onVolumeInput($event)"
			></app-range-control>
			<span
				class="hidden w-[var(--range-volume-readout-width)] shrink-0 text-end text-body-sm text-text-secondary tabular-nums app-wide:inline"
				data-region="volume-readout"
				>{{ volumeDb() }}</span
			>
		</div>
	</div>
	@if (session.commandError(); as error) {
	<p
		class="mx-auto mt-3 w-full max-w-[var(--content-max-width)] text-body-sm text-error"
		role="alert"
	>
		{{ error }}
	</p>
	}
</section>
