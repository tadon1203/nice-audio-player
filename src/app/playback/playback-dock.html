<section
	aria-label="Playback controls"
	class="grid h-full min-h-0 grid-rows-[var(--nap-space-tight)_minmax(0,1fr)] bg-surface-chrome"
	data-testid="playback-dock"
>
	<app-range-control
		class="range-control-progress h-tight"
		data-range-control="playback"
		[min]="0"
		[max]="session.durationMs() ?? 0"
		[step]="100"
		[value]="seekValue()"
		[progress]="progressPercent()"
		label="Playback position"
		[disabled]="!canSeek"
		(valueInput)="onSeekInput($event)"
		(valueChange)="onSeekChange($event)"
	></app-range-control>
	<div
		class="grid min-h-0 min-w-0 grid-cols-[minmax(0,1fr)_auto] grid-rows-[auto_auto] items-center gap-x-group px-group py-related app-wide:w-full app-wide:grid-cols-[minmax(0,1fr)_minmax(0,2fr)_minmax(0,0.75fr)] app-wide:grid-rows-1 app-wide:gap-group app-wide:px-group app-wide:py-related"
	>
		<div class="flex min-w-0 items-center gap-control" data-region="playback-identity">
			<app-artwork
				class="size-control-prominent shrink-0 rounded-artwork"
				[artwork]="session.artwork()"
				[alt]="session.title() + ' artwork'"
				loading="eager"
			/>
			<div class="min-w-0">
				<p class="truncate text-body text-content-primary">{{ session.title() }}</p>
				@if (session.artist(); as artist) {
				<p class="truncate text-body text-content-secondary">{{ artist }}</p>
				}
			</div>
		</div>

		<div class="col-span-2 min-w-0 app-wide:col-span-1" data-region="playback-core">
			<div class="flex items-center justify-center gap-related" aria-label="Transport controls">
				<span class="shrink-0 text-body text-content-secondary tabular-nums"
					>{{ seekValue() | formatDuration }}</span
				>
				<button
					type="button"
					appButton="transport"
					aria-label="Previous track"
					[disabled]="!session.snapshot()?.canGoPrevious || session.transportPending() !== null"
					(click)="session.previous()"
				>
					<svg lucideSkipBack aria-hidden="true" class="size-icon"></svg>
				</button>
				<button
					type="button"
					appButton="transport"
					[aria-label]="isPlaying ? 'Pause' : 'Resume'"
					[disabled]="session.snapshot()?.status !== 'playing' && session.snapshot()?.status !== 'paused' || session.transportPending() !== null"
					(click)="togglePlayback()"
				>
					@if (isPlaying) {
					<svg lucidePause aria-hidden="true" class="size-icon"></svg>
					} @else {
					<svg lucidePlay aria-hidden="true" class="size-icon"></svg>
					}
				</button>
				<button
					type="button"
					appButton="transport"
					aria-label="Next track"
					[disabled]="!session.snapshot()?.canGoNext || session.transportPending() !== null"
					(click)="session.next()"
				>
					<svg lucideSkipForward aria-hidden="true" class="size-icon"></svg>
				</button>
				<span class="shrink-0 text-body text-content-secondary tabular-nums"
					>{{ session.durationMs() | formatDuration }}</span
				>
			</div>
		</div>

		<div class="flex min-w-0 items-center justify-end gap-control" data-region="volume">
			<button
				type="button"
				appButton="icon"
				[aria-label]="session.muted() ? 'Unmute' : 'Mute'"
				[disabled]="session.mutePending()"
				(click)="session.toggleMute()"
			>
				@if (session.muted()) {
				<svg lucideVolumeX aria-hidden="true" class="size-icon"></svg>
				} @else {
				<svg lucideVolume2 aria-hidden="true" class="size-icon"></svg>
				}
			</button>
			<app-range-control
				class="range-control-volume h-control-prominent min-w-0 flex-1"
				data-range-control="volume"
				[attr.data-muted]="session.muted() ? '' : null"
				[min]="0"
				[max]="1"
				[step]="0.01"
				[value]="session.volume()"
				[progress]="volumePercent()"
				label="Volume"
				[valueText]="session.muted() ? 'Muted' : null"
				(valueInput)="onVolumeInput($event)"
			></app-range-control>
			<span
				class="hidden shrink-0 text-end text-body text-content-secondary tabular-nums app-wide:inline"
				data-region="volume-readout"
				>{{ volumeDb() }}</span
			>
		</div>
	</div>
	@if (session.commandError(); as error) {
	<p
		class="mx-auto mt-related w-full max-w-layout-reference-width text-body text-danger"
		role="alert"
	>
		{{ error }}
	</p>
	}
</section>
