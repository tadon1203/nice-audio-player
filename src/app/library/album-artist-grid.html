<div class="grid grid-cols-[repeat(auto-fill,minmax(var(--spacing-media-tile),1fr))] gap-6">
	@for (artist of state().items; track artist.key.name) {
	<button
		type="button"
		appButton="secondary"
		class="min-w-0 flex-col items-stretch gap-3 p-2 text-start"
		[aria-label]="'Browse albums by ' + artist.key.name"
		(click)="selectArtist.emit(artist.key.name)"
	>
		<app-artwork class="w-full" [artwork]="artist.artwork" [alt]="artist.key.name + ' artwork'" />
		<span class="truncate text-body-medium text-on-surface">{{ artist.key.name }}</span>
		@if (artist.albumCount !== null) {
		<span class="text-body-small text-secondary">{{ artist.albumCount }} albums</span>
		}
	</button>
	}
</div>
