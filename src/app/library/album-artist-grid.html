<div
	class="grid grid-cols-[repeat(auto-fill,minmax(var(--spacing-media-artist-tile),var(--spacing-media-artist-tile)))] gap-x-section gap-y-region"
	data-testid="album-artist-grid"
>
	@for (artist of state().items; track artist.key.name) {
	<button
		type="button"
		appButton="album"
		class="group min-w-0 flex-col gap-related text-start"
		[aria-label]="'Browse albums by ' + artist.key.name"
		(click)="selectArtist.emit(artist.key.name)"
	>
		<app-artwork
			class="w-full rounded-round group-hover:bg-surface-hover"
			[artwork]="artist.artwork"
			[alt]="artist.key.name + ' artwork'"
		/>
		<span class="truncate text-center text-section text-content-primary"
			>{{ artist.key.name }}</span
		>
		@if (artist.albumCount !== null && artist.trackCount !== null) {
		<span class="text-center text-body text-content-secondary tabular-nums"
			>{{ artist.albumCount }} albums · {{ artist.trackCount }} tracks</span
		>
		} @else if (artist.albumCount !== null) {
		<span class="text-center text-body text-content-secondary tabular-nums"
			>{{ artist.albumCount }} albums</span
		>
		}
	</button>
	}
</div>
