<div
	class="grid grid-cols-[repeat(auto-fill,minmax(var(--spacing-media-tile),max-content))] gap-x-7 gap-y-3"
>
	@for (album of state().items; track album.key.title + album.key.albumArtist) {
	<button
		type="button"
		appButton="album"
		class="group min-w-0 flex-col items-stretch gap-1"
		[aria-label]="'Open album ' + album.key.title + ' by ' + album.key.albumArtist"
		(click)="openAlbum.emit(album.key)"
	>
		<app-artwork
			class="w-media-tile rounded-small group-hover:bg-surface-container"
			[artwork]="album.artwork"
			[alt]="album.key.title + ' artwork'"
		/>
		<span class="w-media-tile truncate text-body-small text-on-surface">{{ album.key.title }}</span>
		<span class="w-media-tile truncate text-body-small text-secondary"
			>{{ album.key.albumArtist }}</span
		>
	</button>
	}
</div>
