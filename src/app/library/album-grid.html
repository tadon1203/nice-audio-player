<div
	class="grid grid-cols-[repeat(auto-fill,minmax(var(--album-tile-size),max-content))] gap-x-7 gap-y-3"
>
	@for (album of state().items; track album.key.title + album.key.albumArtist) {
	<button
		type="button"
		appButton="album"
		class="group min-w-0 flex-col items-stretch gap-1"
		[aria-label]="'Play album ' + album.key.title + ' by ' + album.key.albumArtist"
		(click)="playAlbum.emit(album.key)"
	>
		<app-artwork
			class="w-[var(--album-tile-size)] rounded-control group-hover:bg-surface-hover"
			[artwork]="album.artwork"
			[alt]="album.key.title + ' artwork'"
		/>
		<span class="w-[var(--album-tile-size)] truncate text-body-sm text-text-primary"
			>{{ album.key.title }}</span
		>
		<span class="w-[var(--album-tile-size)] truncate text-body-sm text-text-secondary"
			>{{ album.key.albumArtist }}</span
		>
	</button>
	}
</div>
