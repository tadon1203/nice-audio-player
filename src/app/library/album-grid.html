<div
	class="grid grid-cols-[repeat(auto-fill,minmax(var(--spacing-media-tile),var(--spacing-media-tile)))] gap-x-section gap-y-region"
>
	@for (album of state().items; track album.key.title + album.key.albumArtist) {
	<button
		type="button"
		hlmBtn
		variant="ghost"
		class="group !h-auto w-full min-w-0 flex-col !items-stretch gap-tight rounded-none !border-0 !p-0 text-start hover:bg-transparent active:bg-transparent"
		[aria-label]="'Open album ' + album.key.title + ' by ' + album.key.albumArtist"
		(click)="openAlbum.emit(album.key)"
	>
		<app-artwork
			class="w-full rounded-artwork group-hover:bg-surface-hover"
			[artwork]="album.artwork"
			[alt]="album.key.title + ' artwork'"
		/>
		<span class="w-full truncate text-body text-content-primary">{{ album.key.title }}</span>
		<span class="w-full truncate text-body text-content-secondary"
			>{{ album.key.albumArtist }}</span
		>
	</button>
	}
</div>
