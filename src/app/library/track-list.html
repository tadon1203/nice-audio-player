<ul class="divide-y divide-outline-variant" aria-label="Tracks">
	@for (track of state().items; track track.id) {
	<li>
		<button
			type="button"
			appButton="secondary"
			class="grid min-h-16 w-full grid-cols-[minmax(0,1fr)_minmax(0,1fr)_auto_auto] justify-start gap-4 rounded-none border-0 px-2 text-start"
			[disabled]="!track.playable || track.availability !== 'available'"
			[aria-label]="'Play ' + track.title"
			(click)="playTrack.emit(track.id)"
		>
			<span class="min-w-0 truncate text-body-medium text-on-surface">{{ track.title }}</span>
			<span class="min-w-0 truncate text-body-small text-secondary"
				>{{ track.artist ?? 'Unknown artist' }}</span
			>
			<span class="min-w-0 truncate text-body-small text-secondary"
				>{{ track.album ?? 'Unknown album' }}</span
			>
			<span class="text-body-small text-secondary">{{ track.durationMs | formatDuration }}</span>
			@if (track.availability === 'missing') {
			<span class="col-span-full text-body-small text-error">Missing</span>
			} @else if (!track.playable) {
			<span class="col-span-full text-body-small text-on-surface-variant">Unavailable</span>
			} @if (activeTrackId() === track.id && playbackStatus() === 'playing') {
			<span class="col-span-full text-body-small text-on-surface">Playing</span>
			} @else if (activeTrackId() === track.id && playbackStatus() === 'paused') {
			<span class="col-span-full text-body-small text-on-surface">Paused</span>
			}
		</button>
	</li>
	}
</ul>
