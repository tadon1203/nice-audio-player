<nav
	class="flex min-h-0 flex-wrap items-center gap-tight border-b border-stroke-subtle bg-surface-chrome px-group py-control app-wide:h-full app-wide:flex-col app-wide:items-stretch app-wide:border-e app-wide:border-b-0 app-wide:px-related app-wide:pt-layout-inline app-wide:pb-related"
	aria-label="Application"
>
	<div class="flex min-w-0 flex-1 flex-wrap gap-tight app-wide:flex-none app-wide:flex-col">
		<p class="mb-related hidden px-control text-body text-content-secondary app-wide:block">
			Library
		</p>
		@for (destination of destinations; track destination.route) {
		<a
			[routerLink]="destination.route"
			routerLinkActive
			ariaCurrentWhenActive="page"
			class="group relative flex h-nav-row min-w-0 flex-1 items-center justify-center gap-control rounded-control px-control text-label text-content-secondary no-underline hover:bg-surface-hover hover:text-content-primary active:bg-surface-pressed aria-[current=page]:bg-surface-selected aria-[current=page]:text-content-primary app-wide:flex-none app-wide:justify-start app-wide:px-control"
		>
			@switch (destination.id) { @case ('albums') {
			<ng-icon
				name="lucideDisc"
				aria-hidden="true"
				class="size-icon-small shrink-0 text-icon-small"
			/>
			} @case ('albumArtists') {
			<ng-icon
				name="lucideUsersRound"
				aria-hidden="true"
				class="size-icon-small shrink-0 text-icon-small"
			/>
			} @case ('tracks') {
			<ng-icon
				name="lucideListMusic"
				aria-hidden="true"
				class="size-icon-small shrink-0 text-icon-small"
			/>
			} }
			<span class="truncate">{{ destination.label }}</span>
		</a>
		}
	</div>
	<a
		[routerLink]="'/settings'"
		routerLinkActive
		ariaCurrentWhenActive="page"
		class="group relative flex h-nav-row min-w-0 flex-1 items-center justify-center gap-control rounded-control px-control text-label text-content-secondary no-underline hover:bg-surface-hover hover:text-content-primary active:bg-surface-pressed aria-[current=page]:bg-surface-selected aria-[current=page]:text-content-primary app-wide:mt-auto app-wide:flex-none app-wide:justify-start app-wide:px-control"
	>
		<ng-icon
			name="lucideSettings"
			aria-hidden="true"
			class="size-icon-small shrink-0 text-icon-small"
		/>
		<span class="truncate">Settings</span>
	</a>
</nav>
