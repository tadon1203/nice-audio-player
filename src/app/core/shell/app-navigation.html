<nav
	class="grid grid-cols-2 content-start gap-2 border-b border-border-subtle bg-surface px-6 py-2 app-wide:h-full app-wide:grid-cols-1 app-wide:border-e app-wide:border-b-0 app-wide:px-3 app-wide:pt-18 app-wide:pb-6"
	aria-label="Application"
>
	@for (destination of destinations; track destination.route) {
	<a
		[routerLink]="destination.route"
		routerLinkActive
		ariaCurrentWhenActive="page"
		class="group relative flex min-h-12 items-center justify-center rounded-control px-3 text-body-lg text-text-secondary no-underline hover:bg-surface-hover hover:text-text-primary active:bg-surface-pressed aria-[current=page]:bg-surface-raised aria-[current=page]:text-text-primary app-wide:justify-start app-wide:px-6"
	>
		{{ destination.label }}
		<span
			aria-hidden="true"
			class="absolute inset-x-3 bottom-0 hidden h-[3px] rounded-full bg-current group-aria-[current=page]:block app-wide:inset-x-auto app-wide:inset-y-2 app-wide:start-1 app-wide:bottom-auto app-wide:h-auto app-wide:w-[3px]"
		></span>
	</a>
	}
</nav>
