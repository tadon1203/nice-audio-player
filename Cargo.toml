[workspace]
members = ["backend", "src-tauri"]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Dependencies (symphonia, blake3, rubato) are far too slow unoptimized for whole-file decoding,
# which waveform analysis does; keep them optimized in dev builds.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.nice-audio-player-backend]
opt-level = 3
