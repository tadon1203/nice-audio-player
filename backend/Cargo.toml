[package]
name = "nice-audio-player-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
lrc_rs = "=1.0.1"
rand = "=0.9.2"
log = "0.4"
cpal = "0.18.1"
ringbuf = "0.4"
symphonia = { version = "0.6.0", features = ["all"] }
rusqlite = { version = "=0.40.0", features = ["bundled"] }
lofty = "=0.24.0"
walkdir = "=2.5.0"
dunce = "=1.0.5"
blake3 = "=1.8.5"
notify = "=8.2.0"
rubato = { version = "4.0.0", default-features = false, features = ["fft_resampler"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
encoding_rs = "0.8.42"
chardetng = "1.0.0"
triple_buffer = "9.0.0"
