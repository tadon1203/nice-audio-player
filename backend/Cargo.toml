[package]
name = "nice-audio-player-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
lrc_rs = "1.0"
rand = "0.9"
log = "0.4"
cpal = "0.18.1"
ringbuf = "0.5"
symphonia = { version = "0.6.0", features = ["all"] }
rusqlite = { version = "0.40", features = ["bundled", "functions", "trace"] }
lofty = "0.25"
walkdir = "2.5"
dunce = "1.0"
blake3 = "1.8"
notify = "8.2"
rubato = { version = "5", default-features = false, features = ["fft_resampler"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
encoding_rs = "0.8.42"
chardetng = "1.0.0"
triple_buffer = "9.0.0"
unicode-normalization = "0.1"

# Background thread priority for waveform analysis.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }
