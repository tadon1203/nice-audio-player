[package]
name = "nice-audio-player-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "=0.7.16", features = ["rt"] }
notify-debouncer-full = "=0.7.0"
rusqlite_migration = "=2.6.0"
tempfile = "=3.23.0"
lrc_rs = "=1.0.1"
rand = "=0.9.2"
log = "0.4"
cpal = "0.18.1"
ringbuf = "0.4"
symphonia = { version = "0.6.0", features = ["all"] }
rusqlite = { version = "=0.40.0", features = ["bundled"] }
lofty = "=0.24.0"
walkdir = "=2.5.0"
dunce = "=1.0.5"
blake3 = "=1.8.5"
notify = "=8.2.0"
rubato = { version = "4.0.0", default-features = false, features = ["fft_resampler"] }

[profile.release]
strip = true
