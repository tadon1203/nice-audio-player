[package]
name = "nice-audio-player-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
default-run = "nice-audio-player-backend"

[[bin]]
name = "nice-audio-player-backend"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-serde = "=0.0.12"
specta-typescript = "=0.0.12"
log = "0.4"
cpal = "0.18.1"
ringbuf = "0.4"
symphonia = { version = "0.6.0", features = ["all"] }
rusqlite = { version = "=0.34.0", features = ["bundled"] }
lofty = "=0.24.0"
walkdir = "=2.5.0"
dunce = "=1.0.5"
blake3 = "=1.8.5"
notify = "=8.2.0"
rubato = { version = "4.0.0", default-features = false, features = ["fft_resampler"] }

[profile.release]
strip = true
