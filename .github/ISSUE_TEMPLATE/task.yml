name: Task
description: Create a focused implementation task

body:
  - type: markdown
    attributes:
      value: |
        Create a focused task with a clear goal, scope, and completion criteria.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be achieved?
      placeholder: Describe the desired outcome.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included in this issue?
      placeholder: |
        - Change ...
        - Update ...
        - Verify ...
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Done
      description: Define task-specific completion criteria.
      placeholder: |
        - [ ] `pnpm check` passes
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional constraints, references, or implementation notes.
      placeholder: Add any relevant context.
    validations:
      required: false

  - type: input
    id: suggested-branch
    attributes:
      label: Suggested branch
      description: Allowed types are `feat`, `fix`, `refactor`, `perf`, `docs`, `test`, `build`, `ci`, `chore`, and `revert`.
      placeholder: <type>/<issue-number>-<kebab-case>
    validations:
      required: false
