[package]
name = "nice-audio-player"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nice_audio_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Enabled only by bindings tooling; MockRuntime is not part of normal builds, and the
# tooling supplies its scoped Windows linker flag because the Wry test binary cannot load it.
bindings-export = ["tauri/test"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
cpal = "0.18.1"
ringbuf = "0.4"
symphonia = { version = "0.6.0", features = ["all"] }
rusqlite = { version = "=0.34.0", features = ["bundled"] }
lofty = "=0.24.0"
walkdir = "=2.5.0"
dunce = "=1.0.5"
blake3 = "=1.8.5"
rubato = { version = "4.0.0", default-features = false, features = ["fft_resampler"] }
