[package]
name = "nice-audio-player"
version = "0.0.1"
description = "A local-first Windows desktop music player"
authors = ["Nice Audio Player"]
edition = "2021"
default-run = "nice-audio-player"
rust-version = "1.98"

[[bin]]
name = "nice-audio-player"
path = "src/main.rs"

[[bin]]
name = "export-bindings"
path = "src/bin/export-bindings.rs"

[lib]
name = "nice_audio_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# The app-level E2E build (`tests-app/`): the WebdriverIO plugins, never in a shipped build.
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
backend = { package = "nice-audio-player-backend", path = "../backend" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# Windows system media transport controls: media keys and the overlay.
[target.'cfg(windows)'.dependencies]
souvlaki = "0.8.3"
