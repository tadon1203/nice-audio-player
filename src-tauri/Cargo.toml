[package]
name = "nice-audio-player"
version = "0.0.1"
description = "A local-first Windows desktop music player"
authors = ["Nice Audio Player"]
edition = "2021"
rust-version = "1.98"

[lib]
name = "nice_audio_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
backend = { package = "nice-audio-player-backend", path = "../backend" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
