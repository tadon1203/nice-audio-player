[package]
name = "nice-audio-player"
version = "0.0.1"
description = "A local-first Windows desktop music player"
authors = ["Nice Audio Player"]
edition.workspace = true
default-run = "nice-audio-player"
rust-version.workspace = true

[[bin]]
name = "nice-audio-player"
path = "src/main.rs"

[[bin]]
name = "export-bindings"
path = "src/bin/export-bindings.rs"

[lib]
name = "nice_audio_player_lib"
crate-type = ["rlib"]

[features]
# The app-level E2E build (`tests-app/`): the WebdriverIO plugins, never in a shipped build.
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
backend = { package = "nice-audio-player-backend", path = "../backend" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = { version = "2", features = ["colored"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
anyhow = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
tauri-specta = { workspace = true }

[lints]
workspace = true
